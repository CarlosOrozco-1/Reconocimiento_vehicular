<div class="map-view-container animate-in">
  <!-- Sidebar Flotante -->
  <aside class="map-sidebar panel" [class.collapsed]="!selectedRoute">
    <div class="sidebar-inner">
      
      <!-- Header -->
      <div class="sidebar-header" *ngIf="selectedRoute">
        <div class="header-main">
          <span class="badge-route">{{ selectedRoute }}</span>
          <button class="icon-btn-close" (click)="clearSelection()" title="Cerrar">✕</button>
        </div>
        <h2 class="route-title">{{ selectedRouteName }}</h2>
      </div>

      <!-- Filtros Rápidos (Ocultos en el side-panel ya que ahora es solo para detalles) -->
      <div class="quick-filters" *ngIf="selectedRoute">
        <button class="filter-chip" [class.active]="!showOnlySelectedRoute" (click)="showOnlySelectedRoute = false">Ver toda la red</button>
        <button class="filter-chip" [class.active]="showOnlySelectedRoute" (click)="showOnlySelectedRoute = true">Aislar ruta</button>
      </div>

      <!-- Estadísticas -->
      <div class="stats-container" *ngIf="selectedRouteSummary; else catalogTpl">
        <div class="stat-group">
          <div class="stat-mini-card">
            <span class="label">FLUJO NORMAL</span>
            <span class="value">{{ $any(selectedRouteSummary)['normal_flow'] | number }} <small>veh/h</small></span>
          </div>
          <div class="stat-mini-card peak">
            <span class="label">HORA PICO</span>
            <span class="value">{{ $any(selectedRouteSummary)['peak_flow'] | number }} <small>veh/h</small></span>
          </div>
        </div>

        <div class="info-row" *ngIf="selectedDepartments.length > 0">
          <span class="info-label">Cruza por:</span>
          <div class="dept-tags">
            <span class="dept-tag" *ngFor="let d of selectedDepartments">{{ d }}</span>
          </div>
        </div>

        <div class="chart-wrapper">
          <h4 class="chart-title">Curva de Tráfico (Promedio 24h)</h4>
          <div class="canvas-container">
            <canvas id="trafficCurveChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Catálogo de Rutas -->
      <ng-template #catalogTpl>
        <div class="route-list">
          <button *ngFor="let route of routeCatalog" 
                  class="route-item" 
                  (click)="onRouteClick(strConv($any(route)['route_code'] ?? ''), strConv($any(route)['name'] ?? ''))">
            <div class="ri-left">
              <span class="ri-code">{{ route['route_code'] }}</span>
              <span class="ri-name">{{ route['name'] }}</span>
            </div>
            <span class="ri-km">{{ route['length_km'] }} km</span>
          </button>
        </div>
      </ng-template>
    </div>
  </aside>

  <!-- Contenedor del Mapa Leaflet -->
  <div id="main-map" class="leaflet-map"></div>
</div>
