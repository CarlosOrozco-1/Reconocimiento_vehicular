version: "3.9"

services:
  db:
    image: docker.io/postgis/postgis:16-3.4
    container_name: traffic_gt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traffic_gt}
      POSTGRES_USER: ${POSTGRES_USER:-traffic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic_pass}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - traffic_gt_pgdata:/var/lib/postgresql/data
      - ./scriptDB:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traffic_user} -d ${POSTGRES_DB:-traffic_gt}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  traffic_gt_pgdata:
